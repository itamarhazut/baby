<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="משפחת חזות">
<meta name="theme-color" content="#F2F6FB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>משפחת חזות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6FB; --surface:#FFFFFF; --ink:#1C2742; --muted:#62708C; --line:#DCE4EF;
  --sky:#DCEAF8; --gold:#D9A43A; --gold-soft:#FBF1DC; --done:#2F8F6F; --danger:#B4453A;
  --card-a:#1C2742; --card-b:#2C3D66; --card-ink:#F4F7FC;
  --serif:"Frank Ruhl Libre", "David", "Times New Roman", serif;
  --sans:"Assistant", "Arial Hebrew", Arial, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10162A; --surface:#19213A; --ink:#E9EEF8; --muted:#9AA7C2; --line:#2A3555;
    --sky:#22305A; --gold:#E8BC5C; --gold-soft:#3A3220; --done:#5BC79E; --danger:#E07B70;
    --card-a:#25345E; --card-b:#3A5088; --card-ink:#F4F7FC;
  }
}
:root[data-theme="dark"]{
  --bg:#10162A; --surface:#19213A; --ink:#E9EEF8; --muted:#9AA7C2; --line:#2A3555;
  --sky:#22305A; --gold:#E8BC5C; --gold-soft:#3A3220; --done:#5BC79E; --danger:#E07B70;
  --card-a:#25345E; --card-b:#3A5088; --card-ink:#F4F7FC;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
main{max-width:560px;margin:0 auto;padding:16px 16px 110px}
header.top{max-width:560px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header.top h1{font-family:var(--serif);font-weight:900;font-size:28px;margin:0;letter-spacing:-.01em}
.sync{font-size:13px;color:var(--muted)}
h2{font-family:var(--serif);font-size:22px;margin:28px 0 10px}
h3{font-size:15px;color:var(--muted);font-weight:700;margin:22px 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Tab bar */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
nav.tabs button .ic{font-size:22px;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-selected="true"] .ic{transform:translateY(-1px)}
section[hidden]{display:none}

/* Baby card */
.idcard{position:relative;border-radius:22px;padding:22px 20px 18px;color:var(--card-ink);
  background:linear-gradient(150deg,var(--card-a),var(--card-b));overflow:hidden}
.idcard::after{content:"";position:absolute;inset:auto -60px -80px auto;width:220px;height:220px;border-radius:50%;
  border:28px solid rgba(255,255,255,.06)}
.idcard .name{font-family:var(--serif);font-weight:900;font-size:34px;line-height:1.1;margin:0}
.idcard .sub{opacity:.8;font-size:15px;margin-top:4px}
.idcard .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:20px;position:relative;z-index:1}
.idcard .k{font-size:12.5px;opacity:.7}
.idcard .v{font-size:17px;font-weight:600;word-break:break-word}
.idrow{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.idrow .v{font-family:var(--sans);font-size:22px;letter-spacing:.08em;direction:ltr;flex:1;text-align:right}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:inherit;border-radius:10px;padding:6px 10px;font-size:14px}
.age{display:inline-block;margin-top:12px;background:var(--gold);color:#1C2742;font-weight:700;border-radius:999px;padding:3px 12px;font-size:14px}

.brit-strip{margin-top:14px;display:flex;align-items:center;gap:14px;background:var(--gold-soft);border-radius:16px;padding:14px 16px}
.brit-strip .num{font-family:var(--serif);font-weight:900;font-size:40px;line-height:1;color:var(--gold);min-width:48px;text-align:center}
.brit-strip .t{font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:left}
.kv a{color:inherit}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#1C2742}
.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* Progress */
.progress{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.bar{flex:1;height:8px;background:var(--sky);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);border-radius:99px;transition:width .3s}

/* Task list */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.list li{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.chk{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);margin:1px 0 0;display:grid;place-items:center;background:var(--surface)}
.chk:checked{background:var(--done);border-color:var(--done)}
.chk:checked::after{content:"✓";color:#fff;font-weight:700;font-size:16px}
.list .body{flex:1;min-width:0}
.list .title{font-weight:600}
.list li.done .title{color:var(--muted)}
.list .meta{font-size:14px;color:var(--muted);margin-top:2px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip.me{background:var(--sky);color:var(--ink);border-color:transparent}
.chip.her{background:var(--gold-soft);color:var(--ink);border-color:transparent}
.more{background:none;border:0;color:var(--muted);font-size:20px;padding:0 4px;line-height:1}
.badge{display:inline-block;font-size:12.5px;font-weight:700;border-radius:6px;padding:1px 7px;margin-inline-start:6px;vertical-align:1px}
.badge.late{background:var(--danger);color:#fff}
.badge.soon{background:var(--gold);color:#1C2742}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0}

input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=tel],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline-check{display:flex;align-items:center;gap:10px;margin-bottom:12px}

/* Log */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:14.5px}
.quick button .ic{font-size:26px}
.quick button:active{background:var(--sky)}
.since{display:flex;gap:10px;margin:14px 0 4px}
.since div{flex:1;background:var(--sky);border-radius:14px;padding:10px 12px}
.since b{display:block;font-family:var(--serif);font-size:22px}
.loglist li{align-items:center}
.loglist .time{font-variant-numeric:tabular-nums;font-weight:700;min-width:48px}

dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 24px));max-height:calc(100% - 40px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,30,.5)}
dialog .dh{position:sticky;top:0;background:var(--bg);padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
dialog .dh h2{margin:0;font-size:20px}
dialog .db{padding:14px 18px 18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
.note{font-size:14px;color:var(--muted);margin-top:10px}
.empty{padding:18px;text-align:center;color:var(--muted)}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 8px}
.ghead h3{margin:0}
.gbtns{display:flex;gap:6px}
.gbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-size:15px;font-weight:600;white-space:nowrap}
.list:empty{padding:14px;text-align:center;color:var(--muted);font-size:15px}
.list:empty::after{content:"אין משימות בקבוצה הזאת"}
.grow{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.grow input{flex:1;min-width:0}
.sq{flex:none;width:40px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.sq:disabled{opacity:.35}
.addrow select{width:auto;max-width:42%}
.fab{position:fixed;left:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:12;border:0;border-radius:999px;padding:13px 22px;font-weight:700;font-size:16px;background:var(--ink);color:var(--bg);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.fab.on{background:var(--gold);color:#1C2742}
#tab-brit{padding-bottom:70px}
.qk{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.qk summary{font-weight:700;cursor:pointer}
.qk h4{margin:12px 0 6px;font-size:13.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:15px}
.chips button:active{background:var(--sky)}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.daychips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.nrow .body{flex:1;min-width:0}
.nrow .t{font-weight:600}.nrow .m{font-size:13.5px;color:var(--muted)}
.nbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-bottom:12px}
.nbox h3{margin:10px 0 4px}
.okmsg{color:var(--done);font-weight:600}
.shopcard.bepcard{margin-top:12px;background:linear-gradient(135deg,#D9628E,#B2418F)}
.bepsq{display:flex;gap:6px;flex:none}
.bsq{width:38px;text-align:center}
.bsq i{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:2px dashed rgba(255,255,255,.55);font-style:normal;font-weight:800;font-size:19px;background:rgba(255,255,255,.08)}
.bsq i.full{background:#fff;color:#B2418F;border:2px solid #fff}
.bsq i.today{border:2px solid #fff}
.bsq span{display:block;font-size:12px;margin-top:3px;opacity:.95}
.bday{font-weight:700;margin:14px 0 4px}
.btime{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.shopcard{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:linear-gradient(135deg,#2F8F4E,#2E78C7);color:#fff;border:0;border-radius:18px;padding:16px 18px;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.shopcard .ic{font-size:34px;line-height:1}
.shopcard .tx{flex:1}.shopcard b{display:block;font-size:20px;font-family:var(--serif)}
.shopcard small{display:block;opacity:.9;font-size:14px;margin-top:2px}
.shopcard .ar{font-size:24px}
.backbtn{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px}
#imriSheet{position:fixed;inset:0;z-index:15}
#imriSheet[hidden]{display:none}
.sheetbg{position:absolute;inset:0;background:rgba(10,15,30,.35)}
.sheet{position:absolute;left:12px;width:min(360px,calc(100% - 24px));bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.sheetname{font-family:var(--serif);font-weight:900;font-size:19px;padding:8px 12px 4px}
.sheet button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:14px;padding:11px 12px;font-size:17px;font-weight:700;text-align:start;color:var(--ink)}
.sheet button .ic{font-size:26px;line-height:1}
.sheet button small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-inline-start:auto}
.sheet button.cur{background:var(--sky)}
.sheet button:active{background:var(--sky)}
body.full nav.tabs{display:none}
body.full main{padding-bottom:40px}
body.full .toast{bottom:24px}
.shophead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.shophead .btn{padding:9px 14px;font-size:15px}
.chips.ac{margin-top:8px}
.chips.ac:empty{display:none}
.chips button.sug{background:var(--gold-soft);border-color:transparent}
.dsign{display:flex;align-items:center;gap:10px;background:var(--dc);color:#fff;border-radius:14px 14px 0 0;padding:8px 14px;margin-top:18px}
.dsign .ic{font-size:26px;line-height:1}
.dsign h3{margin:0;color:#fff;font-size:17px;flex:1}
.dsign .cnt{background:rgba(255,255,255,.26);border-radius:999px;padding:2px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.dsign.fin{opacity:.6}
.dsign + .list{border:2px solid var(--dc);border-top:0;border-radius:0 0 14px 14px}
.qty{display:flex;align-items:center;gap:3px;flex:none}
.qb{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;padding:0}
.qb:disabled{opacity:.3}
.qv{min-width:30px;text-align:center;font-weight:800;line-height:1.05}
.qv small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.list li.done .qty{display:none}
.mvbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mvnav{display:flex;gap:10px;margin-top:14px}
.mvnav .btn{flex:1;padding:14px 10px;font-size:16px}
.mvlist li{padding:16px 14px}
.mvlist .title{font-size:19px}
.mvlist .chk{width:32px;height:32px;border-radius:10px}
.mvdone{text-align:center;padding:26px 10px}
.mvdone .big{font-size:54px}
.addbtn{display:block;width:100%;margin-top:8px;background:transparent;border:1.5px dashed var(--line);border-radius:14px;padding:11px;font-weight:600;font-size:16px;color:var(--muted)}
.addbtn:active{background:var(--sky)}
.handle{flex:none;width:44px;height:44px;margin:-8px -6px -8px 0;display:grid;place-items:center;border:0;background:none;font-size:26px;line-height:1;color:var(--muted);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.list li.ghosted{opacity:.3;background:var(--sky)}
.dragging-ghost{position:fixed;z-index:50;margin:0;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.3)}
body.drag-active{user-select:none;-webkit-user-select:none;cursor:grabbing}
.hr{display:flex;align-items:center;gap:6px}
.gear{background:none;border:0;font-size:20px;padding:4px 6px;line-height:1}
#gate{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
#gate[hidden]{display:none}
.gatebox{max-width:420px;margin:6vh auto 0}
.gatebox h1{font-family:var(--serif);font-weight:900;font-size:34px;margin:0 0 6px}
.err{color:var(--danger);min-height:1.4em;font-size:15px;margin:4px 0 10px}
.code{font-size:26px;font-weight:700;letter-spacing:.12em;direction:ltr;text-align:center;background:var(--sky);border-radius:14px;padding:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.addqty{display:flex;align-items:center;gap:10px;margin:8px 2px 2px;font-size:15px;color:var(--muted)}
.addqty b{min-width:26px;text-align:center;font-size:19px;color:var(--ink)}
.addqty select{margin-inline-start:auto;width:auto;flex:none;min-width:96px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;padding:6px 8px}
</style>
</head>
<body>
<header class="top">
  <h1 id="appTitle">משפחת חזות</h1>
  <div class="hr"><span class="sync" id="sync">שומר במכשיר</span><button class="gear" id="gear" aria-label="הגדרות">⚙️</button></div>
</header>
<div id="gate" hidden><div class="gatebox" id="gateBox"></div></div>

<main>
  <!-- Baby -->
  <section id="tab-baby" role="tabpanel">
    <div id="cardWrap"></div>
    <div id="britStrip"></div>
    <h2>פרטים נוספים</h2>
    <div class="panel" id="moreInfo"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="editBaby">עריכת פרטים</button>
      <button class="btn ghost" id="shareCard">שיתוף הפרטים</button>
    </div>
    <h2>מעקב גדילה</h2>
    <div id="growth"></div>
    <button class="btn ghost" id="addGrowth" style="margin-top:10px">הוספת מדידה</button>
  </section>

  <!-- Brit -->
  <section id="tab-brit" role="tabpanel" hidden>
    <button class="btn ghost" id="britBack" style="margin-bottom:8px">→ חזרה</button>
    <div id="britHead"></div>
    <div id="britLists"></div>
    <p class="note" id="britNote"></p>
    <button class="fab" id="editFab" aria-pressed="false">✎ עריכה</button>
  </section>

  <!-- Tasks hub -->
  <section id="tab-tasks" role="tabpanel" hidden>
    <div class="shophead" style="margin-bottom:12px"><h2 style="margin:6px 0 0;flex:1">משימות</h2><button class="btn ghost" id="openNotif" style="padding:9px 14px;font-size:15px">🔔 התראות</button></div>
    <button class="shopcard" id="openShop"><span class="ic">🛒</span><span class="tx"><b>קניות</b><small id="shopCardSub"></small></span><span class="ar">←</span></button>
    <button class="shopcard bepcard" id="openBep"><span class="ic">🧴</span><span class="tx"><b>בפנטן</b><small id="bepSub"></small></span><span class="bepsq" id="bepSq"></span></button>
    <h3>מה צריך לעשות</h3>
    <div class="addrow" style="margin-top:0"><input type="text" id="taskIn" placeholder="משימה חדשה" enterkeyhint="done" autocomplete="off"><button class="btn" id="taskAdd">הוספה</button></div>
    <div id="taskBody"></div>
  </section>

  <!-- Shop -->
  <section id="tab-shop" role="tabpanel" hidden>
    <div class="shophead"><button class="backbtn" id="shopBack" aria-label="חזרה">→</button><h2 style="margin:0;flex:1">קניות</h2><button class="btn gold" id="shopMode">🛒 התחלת קנייה</button></div>
    <div id="shopNormal">

<script>
(function(){
"use strict";
const LS_KEY = "baby-app-state-v1";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);

/* ---------- defaults ---------- */
const BRIT_DEFAULT = [
  ["מוהל וטקס","לתאם מוהל"],["מוהל וטקס","לשאול את המוהל מה להכין (גזה, וזלין, כרית)"],["מוהל וטקס","לבחור סנדק"],
  ["מוהל וטקס","לבחור קוואטער וקוואטערין"],["מוהל וטקס","לחלק כיבודים (כסא אליהו, ברכות, קריאת השם)"],
  ["מוהל וטקס","להחליט על השם"],["מוהל וטקס","יין וכוס לברכה"],
  ["מקום וכיבוד","לסגור מקום (בית כנסת, אולם, בית)"],["מקום וכיבוד","קייטרינג או כיבוד"],["מקום וכיבוד","שתייה וכלים חד פעמיים"],
  ["מקום וכיבוד","צלם"],
  ["הזמנות","רשימת מוזמנים"],["הזמנות","לשלוח הזמנה בוואטסאפ"],["הזמנות","להודיע לרב ולבית הכנסת"],
  ["לתינוק ולאמא","בגד לברית וכיפה"],["לתינוק ולאמא","תיק החתלה מוכן"],["לתינוק ולאמא","פינה שקטה להנקה במקום"],
  ["אחרי הברית","רישום השם במשרד הפנים"],["אחרי הברית","עדכון ספח בתעודת הזהות"],["אחרי הברית","רישום בקופת החולים"],
  ["אחרי הברית","לבדוק שמענק הלידה התקבל (ביטוח לאומי)"]
].map(([group,title]) => ({id:uid(), group, title, who:"", done:false, note:""}));

const CHECKS_DEFAULT = [
  ["baby","חיסון צהבת B (מנה 1) וויטמין K",0,"בבית החולים"],
  ["baby","בדיקת סקר ילודים (דקירה בעקב)",1,"בבית החולים"],
  ["baby","בדיקת שמיעה",1,"בבית החולים"],
  ["baby","ביקורת אצל רופא/ת ילדים",7,""],
  ["baby","ביקור ראשון בטיפת חלב",10,"בשבועיים הראשונים"],
  ["baby","חיסון צהבת B (מנה 2) בגיל חודש",30,"טיפת חלב"],
  ["baby","אולטרסאונד מפרקי ירכיים",42,"אם הומלץ"],
  ["baby","חיסוני גיל חודשיים",60,"טיפת חלב"],
  ["baby","חיסוני גיל 4 חודשים",120,"טיפת חלב"],
  ["baby","חיסוני גיל 6 חודשים",180,"טיפת חלב"],
  ["mom","ביקורת אצל רופא/ת נשים",42,"כשישה שבועות אחרי הלידה"]
].map(([who,title,offset,note]) => ({id:uid(), who, title, offset, date:"", time:"", done:false, doneDate:"", note}));

function defaults(){
  return {
    baby:{name:"",hebName:"",idNum:"",birthDate:"",birthTime:"",afterSunset:false,britOverride:"",weight:"",length:"",head:"",blood:"",
      hospital:"",hmo:"",pediatrician:"",pediatricianPhone:"",tipat:"",tipatPhone:"",father:"",mother:"",notes:""},
    brit: BRIT_DEFAULT, groups:null, afterGroup:"אחרי הברית", checks: CHECKS_DEFAULT, growth:[], shop:[], tasks:[], reminders:{tz:"Asia/Jerusalem",items:[],feed:{enabled:true,hours:3,quietFrom:"",quietTo:""},tasks:{enabled:true}}, shopDepts:null, shopMap:{}, shopHist:{}, log:[], updatedAt:0
  };
}

/* ---------- state + storage ---------- */
let state;
try { const raw = localStorage.getItem(LS_KEY); state = raw ? JSON.parse(raw) : null; } catch(e){ state = null; }
state = Object.assign(defaults(), state || {});
state.baby = Object.assign(defaults().baby, state.baby || {});

/* ---------- sync with Supabase ---------- */
const CFG = window.APP_CONFIG || {};
const FAM_KEY = "baby-app-family-v1";
let sb = null, familyId = null;
let writing = false, pending = false, timer = null, needLoad = false, loadTimer = null, epoch = 0, started = false;
let synced = {}, existsMap = {}, logIds = new Set();

function setSync(t){ $("#sync").textContent = t; }
function canon(v){
  if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+":"+canon(v[k])).join(",") + "}";
  return JSON.stringify(v === undefined ? null : v);
}
const clean = v => JSON.parse(JSON.stringify(v));
const SECTIONS = {
  baby:   {get:()=>({baby:state.baby}),
           set:d=>{ state.baby = Object.assign(defaults().baby, d.baby||{}); }},
  brit:   {get:()=>({brit:state.brit, groups:state.groups, afterGroup:state.afterGroup}),
           set:d=>{ if(Array.isArray(d.brit)) state.brit=d.brit; state.groups=Array.isArray(d.groups)?d.groups:null; state.afterGroup=(typeof d.afterGroup==="string")?d.afterGroup:"אחרי הברית"; }},
  checks: {get:()=>({checks:state.checks}),
           set:d=>{ if(Array.isArray(d.checks)) state.checks=d.checks; }},
  shop:   {get:()=>({shop:state.shop, depts:state.shopDepts||null, map:state.shopMap||{}, hist:state.shopHist||{}}),
           set:d=>{ state.shop = Array.isArray(d.shop)?d.shop:[]; state.shopDepts = Array.isArray(d.depts)?d.depts:null; state.shopMap = (d.map && typeof d.map==="object")?d.map:{}; state.shopHist = (d.hist && typeof d.hist==="object")?d.hist:{}; }},
  tasks:  {get:()=>({tasks:state.tasks||[]}),
           set:d=>{ state.tasks = Array.isArray(d.tasks)?d.tasks:[]; }},
  reminders: {get:()=>({tz:"Asia/Jerusalem", items:(state.reminders&&state.reminders.items)||[], feed:(state.reminders&&state.reminders.feed)||{enabled:true,hours:3,quietFrom:"",quietTo:""}, tasks:(state.reminders&&state.reminders.tasks)||{enabled:true}}),
           set:d=>{ state.reminders = {tz:d.tz||"Asia/Jerusalem", items:Array.isArray(d.items)?d.items:[], feed:Object.assign({enabled:true,hours:3,quietFrom:"",quietTo:""}, d.feed||{}), tasks:Object.assign({enabled:true}, d.tasks||{})}; }},
  growth: {get:()=>({growth:state.growth}),
           set:d=>{ state.growth = Array.isArray(d.growth)?d.growth:[]; }}
};
function persistLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
function save(){
  state.updatedAt = Date.now();
  if (state.log.length > 600) state.log = state.log.slice(-600);
  persistLocal();
  if (sb && familyId){ setSync("שומר…"); scheduleFlush(); }
}
function scheduleFlush(){ clearTimeout(timer); timer = setTimeout(()=>{ timer = null; flush(); }, 500); }
function scheduleLoad(){ clearTimeout(loadTimer); loadTimer = setTimeout(load, 300); }

async function flush(){
  if (!sb || !familyId) return;
  if (writing){ pending = true; return; }
  writing = true;
  let ok = true, wrote = false, seeded = false;
  try {
    for (const [k,s] of Object.entries(SECTIONS)){
      const data = clean(s.get()), c = canon(data);
      if (c === synced[k]) continue;
      if (!wrote){ wrote = true; epoch++; }
      synced[k] = c;
      let r;
      if (existsMap[k]) r = await sb.from("app_state").upsert({family_id:familyId, section:k, data, updated_at:new Date().toISOString()}, {onConflict:"family_id,section"});
      else r = await sb.from("app_state").upsert({family_id:familyId, section:k, data}, {onConflict:"family_id,section", ignoreDuplicates:true});
      if (r.error){ synced[k] = undefined; ok = false; }
      else if (!existsMap[k]){ existsMap[k] = true; seeded = true; }
    }
    const cur = new Map(state.log.map(x=>[x.id,x]));
    const toAdd = state.log.filter(x=>!logIds.has(x.id));
    if (toAdd.length){
      if (!wrote){ wrote = true; epoch++; }
      const r = await sb.from("log_entries").upsert(toAdd.map(x=>({id:x.id, family_id:familyId, t:x.t, type:x.type, note:x.note||""})), {onConflict:"id"});
      if (r.error) ok = false; else toAdd.forEach(x=>logIds.add(x.id));
    }
    const toDel = [...logIds].filter(id=>!cur.has(id));
    if (toDel.length){
      if (!wrote){ wrote = true; epoch++; }
      const r = await sb.from("log_entries").delete().in("id", toDel);
      if (r.error) ok = false; else toDel.forEach(id=>logIds.delete(id));
    }
  } catch(e){ ok = false; }
  writing = false;
  if (!ok){ setSync("אין חיבור, נשמר במכשיר"); setTimeout(scheduleFlush, 8000); }
  else if (wrote) setSync("נשמר ומסונכרן ✓");
  if (seeded) needLoad = true;
  if (pending){ pending = false; scheduleFlush(); }
  if (needLoad){ needLoad = false; scheduleLoad(); }
}

async function load(){
  if (!sb || !familyId) return;
  if (writing || timer){ needLoad = true; return; }
  const myEpoch = epoch;
  let s, l;
  try {
    [s, l] = await Promise.all([
      sb.from("app_state").select("section,data").eq("family_id", familyId),
      sb.from("log_entries").select("id,t,type,note").eq("family_id", familyId).order("t", {ascending:true}).limit(1000)
    ]);
  } catch(e){ setSync("אין חיבור, נשמר במכשיר"); return; }
  if (s.error || l.error){ setSync("אין חיבור, נשמר במכשיר"); return; }
  if (writing || timer || myEpoch !== epoch){ needLoad = false; scheduleLoad(); return; }
  let changed = false;
  const seen = {};
  s.data.forEach(r => {
    const sec = SECTIONS[r.section]; if (!sec) return;
    seen[r.section] = true; existsMap[r.section] = true;
    const c = canon(r.data);
    if (c === synced[r.section]) return;
    sec.set(clean(r.data)); synced[r.section] = c; changed = true;
  });
  Object.keys(SECTIONS).forEach(k => { if (!seen[k]) existsMap[k] = false; });
  // log merge
  const remote = l.data.map(x => ({id:x.id, t:Number(x.t), type:x.type, note:x.note||""}));
  const rids = new Set(remote.map(x=>x.id));
  const localIds = new Set(state.log.map(x=>x.id));
  const merged = new Map();
  remote.forEach(x => { if (logIds.has(x.id) && !localIds.has(x.id)) return; merged.set(x.id, x); });
  state.log.forEach(x => { if (!logIds.has(x.id) && !rids.has(x.id)) merged.set(x.id, x); });
  const next = [...merged.values()].sort((a,b)=>a.t-b.t);
  if (canon(next) !== canon(state.log)){ state.log = next; changed = true; }
  logIds = new Set(rids);
  if (changed){ persistLocal(); renderAll(); }
  scheduleFlush();
  setSync("מסונכרן ✓");
}

function startSync(){
  if (started) return; started = true;
  load();
  try {
    sb.channel("family-" + familyId)
      .on("postgres_changes", {event:"*", schema:"public", table:"app_state", filter:"family_id=eq."+familyId}, scheduleLoad)
      .on("postgres_changes", {event:"*", schema:"public", table:"log_entries"}, scheduleLoad)
      .subscribe();
  } catch(e){}
  setInterval(()=>{ if(!document.hidden) scheduleLoad(); }, 30000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) scheduleLoad(); });
  window.addEventListener("online", scheduleLoad);
}

/* ---------- sign in / family ---------- */
function showGate(html){ $("#gateBox").innerHTML = html; $("#gate").hidden = false; }
function hideGate(){ $("#gate").hidden = true; $("#gateBox").innerHTML = ""; }
function authErr(m){
  m = String((m && m.message) || m || "");
  if (/Invalid login/i.test(m)) return "אימייל או סיסמה שגויים";
  if (/already registered|already been registered/i.test(m)) return "כבר יש חשבון עם המייל הזה. נסו להתחבר.";
  if (/at least 6/i.test(m)) return "הסיסמה חייבת להיות לפחות 6 תווים";
  if (/not confirmed/i.test(m)) return "צריך לאשר את המייל שנשלח אליכם ואז להתחבר";
  if (/rate limit|too many|security purposes/i.test(m)) return "יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.";
  if (/valid email|invalid.*email|Unable to validate email/i.test(m)) return "כתובת המייל לא תקינה";
  if (/fetch|network|Failed/i.test(m)) return "אין חיבור לאינטרנט";
  return "משהו השתבש: " + m;
}
function showSetupMissing(){
  showGate(`<h1>חסר חיבור ל-Supabase</h1><p class="muted">צריך למלא את הקובץ <b dir="ltr">config.js</b> עם הכתובת והמפתח של הפרויקט שלכם ב-Supabase. הפרטים בקובץ README.</p>`);
}
function showAuth(msg){
  showGate(`<h1>משפחת חזות</h1>
    <p class="muted">כניסה לחשבון. שניכם נכנסים עם חשבון משלכם ורואים את אותם נתונים.</p>
    <label class="f"><span>אימייל</span><input type="email" id="aE" autocomplete="email" inputmode="email" dir="ltr"></label>
    <label class="f"><span>סיסמה</span><input type="password" id="aP" autocomplete="current-password" dir="ltr"></label>
    <p class="err" id="aM" role="alert">${esc(msg||"")}</p>
    <div class="row"><button class="btn" id="aIn">כניסה</button><button class="btn ghost" id="aUp">יצירת חשבון</button></div>`);
  const E=$("#aE"), P=$("#aP"), M=$("#aM"), bi=$("#aIn"), bu=$("#aUp");
  const busy = v => { bi.disabled = bu.disabled = v; };
  const creds = () => { const e=E.value.trim(), p=P.value; if(!e||!p){ M.textContent="צריך למלא אימייל וסיסמה"; return null; } return {email:e, password:p}; };
  const doIn = async () => { const c=creds(); if(!c) return; busy(true); M.textContent="";
    try { const {error}=await sb.auth.signInWithPassword(c); if(error){ M.textContent=authErr(error); busy(false); return; } await afterLogin(); }
    catch(e){ M.textContent=authErr(e); busy(false); } };
  bi.onclick = doIn;
  P.addEventListener("keydown", e=>{ if(e.key==="Enter") doIn(); });
  bu.onclick = async () => { const c=creds(); if(!c) return; busy(true); M.textContent="";
    try { const {data,error}=await sb.auth.signUp(c); if(error){ M.textContent=authErr(error); busy(false); return; }
      if (data.session) await afterLogin(); else { M.textContent="נשלח אליכם מייל אישור. אחרי האישור חוזרים לכאן ומתחברים."; busy(false); } }
    catch(e){ M.textContent=authErr(e); busy(false); } };
}
function showFamily(msg){
  showGate(`<h1>עוד צעד קטן</h1>
    <p class="muted">אחד מכם יוצר את המשפחה, והשני מצטרף עם קוד הזמנה.</p>
    <button class="btn full" id="fNew">יצירת משפחה חדשה</button>
    <h3>או הצטרפות עם קוד</h3>
    <label class="f"><input type="text" id="fC" dir="ltr" placeholder="קוד הזמנה" autocapitalize="characters" autocomplete="off"></label>
    <p class="err" id="fM" role="alert">${esc(msg||"")}</p>
    <div class="row"><button class="btn ghost" id="fJoin">הצטרפות</button><button class="btn ghost" id="fOut">יציאה</button></div>`);
  const M=$("#fM");
  $("#fNew").onclick = async () => { M.textContent="";
    const r = await sb.rpc("create_family"); if(r.error){ M.textContent=authErr(r.error); return; } await afterLogin(); };
  $("#fJoin").onclick = async () => { const code=$("#fC").value.trim(); if(!code){ M.textContent="צריך להקליד קוד"; return; } M.textContent="";
    const r = await sb.rpc("join_family", {code}); if(r.error){ M.textContent = /invalid code/i.test(r.error.message||"") ? "הקוד לא נמצא. בדקו שהקלדתם נכון." : authErr(r.error); return; } await afterLogin(); };
  $("#fOut").onclick = signOut;
}
async function afterLogin(){
  let fam = null;
  try {
    const r = await sb.rpc("my_family");
    if (r.error) throw r.error;
    fam = (r.data && r.data[0]) || null;
  } catch(e){
    // offline: continue with the family we remembered
    let cached = null; try { cached = localStorage.getItem(FAM_KEY); } catch(_){}
    if (cached){ familyId = cached; hideGate(); startSync(); setSync("אין חיבור, נשמר במכשיר"); return; }
    showAuth(authErr(e)); return;
  }
  if (!fam){ showFamily(); return; }
  familyId = fam.id;
  try { localStorage.setItem(FAM_KEY, familyId); } catch(e){}
  hideGate(); startSync();
}
async function signOut(){
  try { await sb.auth.signOut(); } catch(e){}
  try { localStorage.removeItem(LS_KEY); localStorage.removeItem(FAM_KEY); } catch(e){}
  location.reload();
}
$("#gear").onclick = async () => {
  let email = "", code = "";
  try { const {data} = await sb.auth.getSession(); email = (data.session && data.session.user.email) || ""; } catch(e){}
  try { const r = await sb.rpc("my_family"); code = (r.data && r.data[0] && r.data[0].invite_code) || ""; } catch(e){}
  openDlg("הגדרות", `
    <p class="small muted" style="margin-top:0">מחובר/ת כ־<span dir="ltr">${esc(email)}</span></p>
    <h3 style="margin-top:6px">קוד הזמנה לבן או בת הזוג</h3>
    ${code ? `<div class="code" id="invCode">${esc(code)}</div>
    <p class="note">בן או בת הזוג יוצרים חשבון, ובמסך "עוד צעד קטן" מקלידים את הקוד.</p>
    <button class="btn ghost full" id="copyCode">העתקת הקוד</button>` : `<p class="note">אין חיבור כרגע.</p>`}
    <div style="height:18px"></div>

/* ---------- dates ---------- */
function parseD(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function today0(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
function diffDays(a,b){ return Math.round((a-b)/86400000); }
const fmtShort = d => d.toLocaleDateString("he-IL",{weekday:"short",day:"numeric",month:"numeric"});
const fmtLong = d => d.toLocaleDateString("he-IL",{day:"numeric",month:"long",year:"numeric"});
function gem(n){
  const U=["","א","ב","ג","ד","ה","ו","ז","ח","ט"],T=["","י","כ","ל","מ","נ","ס","ע","פ","צ"],H=["","ק","ר","ש","ת"];
  let r="";
  while(n>=400){ r+="ת"; n-=400; }
  if(n>=100){ r+=H[Math.floor(n/100)]; n%=100; }
  if(n===15) r+="טו"; else if(n===16) r+="טז"; else { r+=T[Math.floor(n/10)]+U[n%10]; }
  return r.length===1 ? r+"׳" : r.slice(0,-1)+"״"+r.slice(-1);
}
function hebDate(d){
  try{
    const p = {}; new Intl.DateTimeFormat("he-IL-u-ca-hebrew",{day:"numeric",month:"long",year:"numeric"}).formatToParts(d).forEach(x=>p[x.type]=x.value);
    return gem(+p.day)+" ב"+p.month+" "+gem(+p.year % 1000);
  }catch(e){ return ""; }
}
function britDate(){
  const b = state.baby;
  if (b.britOverride) return parseD(b.britOverride);
  const bd = parseD(b.birthDate); if(!bd) return null;
  return addDays(bd, 7 + (b.afterSunset ? 1 : 0));
}
function ageText(){
  const bd = parseD(state.baby.birthDate); if(!bd) return "";
  const days = diffDays(today0(), bd);
  if (days < 0) return "";
  if (days === 0) return "נולד היום";
  if (days === 1) return "בן יום";
  if (days < 14) return "בן " + days + " ימים";
  if (days < 60){ const w=Math.floor(days/7), r=days%7; return "בן " + w + " שבועות" + (r? " ו־"+r+" ימים":""); }
  const m = Math.floor(days/30.44); return "בן " + m + " חודשים";
}

function startDrag(e){
  if (e.pointerType === "mouse" && e.button !== 0) return;
  const li = e.currentTarget.closest("li"); if (!li) return;
  e.preventDefault();
  dragging = true; document.body.classList.add("drag-active");
  const rect = li.getBoundingClientRect(), offY = e.clientY - rect.top, pid = e.pointerId;
  const ghost = document.createElement("ul"); ghost.className = "list dragging-ghost";
  ghost.appendChild(li.cloneNode(true));
  Object.assign(ghost.style, {left: rect.left + "px", top: rect.top + "px", width: rect.width + "px"});
  document.body.appendChild(ghost);
  li.classList.add("ghosted");
  let lastY = e.clientY, raf = 0;
  const place = () => {
    ghost.style.top = (lastY - offY) + "px";
    const el = document.elementFromPoint(rect.left + rect.width / 2, lastY);
    if (!el || !el.closest) return;
    const tli = el.closest("#britLists li");
    if (tli) {
      if (tli !== li){
        const r = tli.getBoundingClientRect();
        tli.parentNode.insertBefore(li, lastY < r.top + r.height / 2 ? tli : tli.nextSibling);
      }
      return;
    }
    const add = el.closest("#britLists .addbtn");
    if (add){ const ul = add.previousElementSibling; if (ul && ul.tagName === "UL" && ul.lastElementChild !== li) ul.appendChild(li); return; }
    const head = el.closest("#britLists .ghead");
    if (head){ const ul = head.nextElementSibling; if (ul && ul.tagName === "UL" && ul.firstElementChild !== li) ul.insertBefore(li, ul.firstChild); return; }
    const ul = el.closest("#britLists ul");
    if (ul && ul !== li.parentNode) ul.appendChild(li);
  };
  const tick = () => {
    if (!dragging) return;
    const H = window.innerHeight; let dy = 0;
    if (lastY < 110) dy = -Math.ceil((110 - lastY) / 6);
    else if (lastY > H - 150) dy = Math.ceil((lastY - (H - 150)) / 6);
    if (dy){ window.scrollBy(0, dy); place(); }
    raf = requestAnimationFrame(tick);
  };
  const move = ev => { if (ev.pointerId !== pid) return; lastY = ev.clientY; place(); };
  const finish = (ev, ok) => {
    if (ev.pointerId !== pid) return;
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onCancel);
    cancelAnimationFrame(raf);
    ghost.remove(); li.classList.remove("ghosted");
    document.body.classList.remove("drag-active");
    dragging = false;
    if (ok) commitOrder(); else renderBrit();
  };
  const onUp = ev => finish(ev, true), onCancel = ev => finish(ev, false);
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onCancel);
  raf = requestAnimationFrame(tick);
}
function commitOrder(){
  const byId = new Map(state.brit.map(x => [x.id, x]));
  const next = [];
  document.querySelectorAll("#britLists ul[data-g]").forEach(ul => {
    ul.querySelectorAll("li[data-id]").forEach(l => {
      const x = byId.get(l.dataset.id);
      if (x){ x.group = ul.dataset.g; next.push(x); byId.delete(l.dataset.id); }
    });
  });
  byId.forEach(x => next.push(x));
  const sig = a => a.map(x => x.id + "|" + (x.group || "עוד")).join(",");
  const changed = sig(next) !== sig(state.brit);
  state.brit = next;
  if (changed) save();
  renderBrit(); renderBaby();
}

const PRODUCTS = ("חיתולים,מגבונים,פורמולה,בפנטן,בקבוקים,מוצצים,עגבניות,עגבניות שרי,מלפפונים,בצל,שום,גזר,תפוחי אדמה,בטטה,בננות,תפוחים,תפוזים,לימון,אבוקדו,חסה,פלפלים,קישואים,חצילים,פטרוזיליה,כוסברה,נענע,ענבים,אבטיח,פטריות,ברוקולי,כרובית,לחם,לחם פרוס,פיתות,חלה,לחמניות,בורקס,עוגה,טורטייה,חזה עוף,שוקיים,כנפיים,שניצל,בשר טחון,סטייק,נקניקיות,כבד,סלמון,דג,חלב,חלב 3%,ביצים,שמנת,שמנת חמוצה,חמאה,יוגורט,שוקו,קוטג',לבן,גבינה צהובה,גבינה לבנה,מוצרלה,פטה,גבינת שמנת,חומוס,טחינה,סלט חצילים,זיתים,טופו,גלידה,אפונה קפואה,שניצלונים,פיצה קפואה,בצק עלים,אורז,פסטה,ספגטי,קמח,סוכר,מלח,שמן,שמן זית,רסק עגבניות,רוטב עגבניות,תירס,טונה,עדשים,חומוס יבש,קוסקוס,בורגול,קטשופ,מיונז,חרדל,מרק,אבקת אפייה,במבה,ביסלי,שוקולד,קורנפלקס,דגנים,דבש,ריבה,נוטלה,וופלים,פופקורן,אגוזים,שקדים,בוטנים,מים,מיץ,קולה,סודה,קפה,נס קפה,תה,בירה,יין,נובימול,פלסטרים,צמר גפן,משחת שיניים,מברשת שיניים,סבון,שמפו,דאודורנט,נייר טואלט,מגבות נייר,נוזל כלים,אבקת כביסה,מרכך כביסה,אקונומיקה,שקיות זבל,ספוגים,טישו,נייר אפייה,נייר אלומיניום").split(",");
function knownProducts(){
  const set = new Map();
  Object.values(SHOP_QUICK).forEach(a=>a.forEach(t=>set.set(t,1)));
  PRODUCTS.forEach(t=>set.set(t,1));
  Object.keys(state.shopHist||{}).forEach(t=>set.set(t,1));
  (state.shop||[]).forEach(x=>set.set(x.title,1));
  return [...set.keys()];
}
function parseQty(txt){
  let t = txt.trim(), qty = 1, unit = "";
  let m = t.match(/^(\d+(?:\.\d+)?)\s*(ק"ג|ק״ג|קג|גרם|ליטר|חבילות|חבילה|מארז)?\s+(.+)$/);
  if (m){ qty = +m[1]; t = m[3].trim(); const u=m[2]; if(u) unit = /ק/.test(u)&&!/גרם/.test(u) ? "ק״ג" : u==="חבילה"?"חבילות":u; }
  else { m = t.match(/^(.+?)\s*[xX×]\s*(\d+)$/); if (m){ t = m[1].trim(); qty = +m[2]; } }
  if (!(qty>0) || qty>999) { qty = 1; }
  return {title:t, qty, unit};
}
/* היסטוריית קניות: ממנה לומדים מה חוזר ומתי כדאי להציע */
function markBought(x){
  if (!state.shopHist || typeof state.shopHist!=="object") state.shopHist={};
  const h = state.shopHist[x.title] || (state.shopHist[x.title]={n:0,ts:[],dept:x.dept});
  h.n++; h.dept=x.dept; h.ts=(h.ts||[]).concat(Date.now()).slice(-6); x.boughtAt=Date.now();
  const keys = Object.keys(state.shopHist);
  if (keys.length>400){ keys.sort((a,b)=>(state.shopHist[a].ts.slice(-1)[0]||0)-(state.shopHist[b].ts.slice(-1)[0]||0)).slice(0,keys.length-400).forEach(k=>delete state.shopHist[k]); }
}
function unmarkBought(x){
  const h = state.shopHist && state.shopHist[x.title];
  if (h && x.boughtAt && Date.now()-x.boughtAt < 120000){ h.n=Math.max(0,h.n-1); h.ts=(h.ts||[]).slice(0,-1); if(!h.n) delete state.shopHist[x.title]; }
  delete x.boughtAt;
}
function suggestions(){
  const H = state.shopHist||{}, open = new Set((state.shop||[]).filter(x=>!x.done).map(x=>x.title)), now = Date.now(), out=[];
  Object.entries(H).forEach(([t,h])=>{
    if (open.has(t) || !h.n) return;
    const ts = h.ts||[], last = ts[ts.length-1]||0;
    let due = false;
    if (ts.length>=2){ const avg=(ts[ts.length-1]-ts[0])/(ts.length-1); due = avg>=3600000*20 && now-last >= avg*0.9; }
    if (due) out.push({t, due:1, score:1000+h.n});
    else if (h.n>=2 && now-last > 86400000*2) out.push({t, due:0, score:h.n});
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,8);
}
function shopRow(x, big){
  const q = +x.qty||1, un = x.unit||"";
  return `<li class="${x.done?"done":""}"><input type="checkbox" class="chk" data-sc="${x.id}" ${x.done?"checked":""} aria-label="${esc(x.title)}">
    <div class="body"><div class="title">${esc(x.title)}</div>${x.note?`<div class="meta">${esc(x.note)}</div>`:""}</div>
    <div class="qty"><button class="qb" data-qm="${x.id}" ${q<=1?"disabled":""} aria-label="פחות">−</button><div class="qv">${q}${un?`<small>${esc(un)}</small>`:""}</div><button class="qb" data-qp="${x.id}" aria-label="עוד">+</button></div>
    ${big?"":`<button class="more" data-se="${x.id}" aria-label="עריכה">⋯</button>`}</li>`;
}
function deptSign(d, items){
  const open = items.filter(x=>!x.done).length;
  return `<div class="dsign ${open?"":"fin"}" style="--dc:${deptColor(d)}"><span class="ic">${deptIc(d)}</span><h3>${esc(deptName(d))}</h3><span class="cnt">${open? open+" לקנות":"הכול נקנה ✓"}</span></div>`;
}
function bindShopRows(){
  const find = id => state.shop.find(y=>y.id===id);
  document.querySelectorAll("[data-sc]").forEach(c=>c.onchange=()=>{ const x=find(c.dataset.sc); if(!x) return; x.done=c.checked; c.checked ? markBought(x) : unmarkBought(x); save(); renderShop(); });
  document.querySelectorAll("[data-qp]").forEach(c=>c.onclick=()=>{ const x=find(c.dataset.qp); if(x){ x.qty=(+x.qty||1)+1; save(); renderShop(); } });
  document.querySelectorAll("[data-qm]").forEach(c=>c.onclick=()=>{ const x=find(c.dataset.qm); if(x && (+x.qty||1)>1){ x.qty=(+x.qty||1)-1; save(); renderShop(); } });
  document.querySelectorAll("[data-se]").forEach(c=>c.onclick=()=>editShop(c.dataset.se));
}
let shopMode = false, shopCur = "";
function renderShop(){
  if(!Array.isArray(state.shop)) state.shop=[];
  const L = state.shop, depts = shopDepts();
  L.forEach(x=>{ if(!x.dept || !depts.includes(x.dept)) x.dept = DEPT_OTHER; });
  $("#shopNormal").hidden = shopMode; $("#shopMv").hidden = !shopMode;
  $("#shopMode").textContent = shopMode ? "✕ יציאה מקנייה" : "🛒 התחלת קנייה";
  renderTasks();
  if (shopMode){ renderShopMode(L, depts); return; }
  let html = L.length ? "" : `<div class="panel" style="margin-top:12px"><div class="empty">הרשימה ריקה. הוסיפו פריט למעלה, והוא יופיע גם אצל בן או בת הזוג.</div></div>`;
  depts.forEach(d=>{
    const items = L.filter(x=>x.dept===d).sort((a,b)=>(a.done-b.done)); if(!items.length) return;
    html += deptSign(d,items) + `<ul class="list">${items.map(x=>shopRow(x)).join("")}</ul>`;
  });
  const doneN = L.filter(x=>x.done).length;
  if (doneN) html += `<button class="addbtn" id="shopClear" style="margin-top:16px">ניקוי כל הפריטים שסומנו (${doneN})</button>`;
  $("#shopBody").innerHTML = html;
  // הצעות לפי היסטוריה
  const sg = suggestions();
  $("#shopSug").innerHTML = sg.length ? `<div class="qk" style="background:var(--gold-soft);border-color:transparent"><b>💡 הצעות לפי מה שקניתם</b><div class="chips" style="margin-top:8px">${sg.map(g=>`<button class="sug" data-sq="${esc(g.t)}">${g.due?"⏰ ":"＋ "}${esc(g.t)}</button>`).join("")}</div><div class="small muted" style="margin-top:6px">⏰ = הגיע הזמן לפי הקצב שלכם</div></div>` : "";
  // הוספה מהירה
  const openT = new Set(L.filter(x=>!x.done).map(x=>x.title));
  $("#shopChips").innerHTML = depts.filter(d=>SHOP_QUICK[d]).map(d=>`<h4>${esc(d)}</h4><div class="chips">${SHOP_QUICK[d].filter(t=>!openT.has(t)).map(t=>`<button data-sq="${esc(t)}" data-sqd="${esc(d)}">＋ ${esc(t)}</button>`).join("")||`<span class="small muted">הכול ברשימה</span>`}</div>`).join("");
  document.querySelectorAll("[data-sq]").forEach(b=>b.onclick=()=>addShopItem(b.dataset.sq, b.dataset.sqd));
  bindShopRows();
  const cl=$("#shopClear"); if(cl) cl.onclick=clearDone;
}
async function clearDone(){
  const n = state.shop.filter(y=>y.done).length; if(!n) return false;
  if(await askConfirm("למחוק את כל "+n+" הפריטים שסומנו?","מחיקה")){ state.shop=state.shop.filter(y=>!y.done); save(); renderShop(); return true; }
  return false;
}
/* מצב קנייה בחנות: מחלקה אחת בכל פעם לפי המסלול */
function renderShopMode(L, depts){
  const withItems = depts.filter(d=>L.some(x=>x.dept===d));
  const hasOpen = d => L.some(x=>x.dept===d && !x.done);
  if (shopCur!=="__end" && !withItems.includes(shopCur)) shopCur = withItems.find(hasOpen) || "__end";
  const total=L.length, done=L.filter(x=>x.done).length, pct = total? Math.round(done/total*100):0;
  let html = `<div class="mvbar"><div class="progress" style="margin:0"><div class="bar"><i style="width:${pct}%"></i></div><span class="small muted">${done} מתוך ${total}</span></div></div>`;
  if (shopCur==="__end"){
    const left = withItems.filter(hasOpen);
    html += left.length
      ? `<div class="mvdone"><div class="big">🧐</div><h2 style="margin:8px 0">נשארו פריטים</h2><p class="muted">עוד לא סימנתם פריטים במחלקות:</p><div class="chips" style="justify-content:center">${left.map(d=>`<button data-mj="${esc(d)}">${esc(d)}</button>`).join("")}</div></div>`
      : `<div class="mvdone"><div class="big">🎉</div><h2 style="margin:8px 0">${total? "קניתם הכול!":"אין מה לקנות"}</h2><button class="btn full" id="mvFinish">סיום קנייה</button></div>`;
  } else {
    const items = L.filter(x=>x.dept===shopCur).sort((a,b)=>(a.done-b.done));
    const idx = withItems.indexOf(shopCur);
    const prev = withItems.slice(0,idx).reverse().find(hasOpen);
    const next = withItems.slice(idx+1).find(hasOpen);
    html += deptSign(shopCur, items) + `<ul class="list mvlist">${items.map(x=>shopRow(x,true)).join("")}</ul>
      <div class="mvnav">${prev?`<button class="btn ghost" id="mvPrev">→ ${esc(deptName(prev))}</button>`:""}<button class="btn" id="mvNext">${next?esc(deptName(next))+" ←":"סיום ←"}</button></div>`;
    setTimeout(()=>{
      const pv=$("#mvPrev"), nx=$("#mvNext");
      if(pv) pv.onclick=()=>{ shopCur=prev; renderShop(); window.scrollTo(0,0); };
      if(nx) nx.onclick=()=>{ shopCur = next || "__end"; renderShop(); window.scrollTo(0,0); };
    },0);
  }
  $("#shopMv").innerHTML = html;
  bindShopRows();
  document.querySelectorAll("[data-mj]").forEach(b=>b.onclick=()=>{ shopCur=b.dataset.mj; renderShop(); window.scrollTo(0,0); });
  const f=$("#mvFinish"); if(f) f.onclick=async()=>{ shopMode=false; renderShop(); window.scrollTo(0,0); await clearDone(); };
}
function addShopItem(title, dept, qty, unit){
  title = (title||"").trim(); if(!title) return;
  qty = qty>0 ? qty : 1; unit = unit||"";
  if(!Array.isArray(state.shop)) state.shop=[];
  const dup = state.shop.find(x=>x.title===title && !x.done);
  if (dup){ dup.qty=(+dup.qty||1)+qty; if(unit) dup.unit=unit; save(); renderShop(); toast("הכמות עודכנה: "+dup.qty); return; }
  const hd = state.shopHist && state.shopHist[title] && state.shopHist[title].dept;
  const d = dept && shopDepts().includes(dept) ? dept : ((state.shopMap||{})[title] || (hd && shopDepts().includes(hd) ? hd : guessDept(title)));
  const again = state.shop.find(x=>x.title===title && x.done);
  if (again){ again.done=false; again.dept=d; again.qty=qty; again.unit=unit; delete again.boughtAt; }
  else state.shop.push({id:uid(), title, done:false, dept:d, qty, unit, note:""});
  save(); renderShop(); toast("נוסף ל"+deptName(d));
}
const aq = {n:1};

function aqReset(){ aq.n=1; $("#aqU").value=""; aqDraw(); }

$("#aqM").onclick=()=>{ if(aq.n>1){ aq.n--; aqDraw(); } };

function addShop(){
  const inp=$("#shopIn"), v=inp.value.trim(); if(!v){ inp.focus(); return; }
  const p = parseQty(v);
  const q = p.qty>1 ? p.qty : aq.n, u = p.unit || $("#aqU").value;
  inp.value=""; renderAc(); addShopItem(p.title, null, q, u); aqReset(); inp.focus();
}
function renderAc(){
  const q = $("#shopIn").value.trim(), box = $("#shopAc");
  if (!q){ box.innerHTML=""; return; }
  const t = parseQty(q).title; if(!t){ box.innerHTML=""; return; }
  const all = knownProducts().filter(x=>x!==t && x.includes(t));
  all.sort((a,b)=>(b.startsWith(t)-a.startsWith(t)) || ((state.shopHist?.[b]?.n||0)-(state.shopHist?.[a]?.n||0)) || a.length-b.length);
  box.innerHTML = all.slice(0,6).map(x=>`<button data-ac="${esc(x)}">${esc(x)}</button>`).join("");
  box.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{ const p=parseQty(q); $("#shopIn").value=""; renderAc(); addShopItem(b.dataset.ac, null, p.qty>1?p.qty:aq.n, p.unit||$("#aqU").value); aqReset(); $("#shopIn").focus(); });
}
function editShop(id){
  const x = state.shop.find(y=>y.id===id); if(!x) return;
  openDlg("עריכת פריט", `
    <label class="f"><span>שם הפריט</span><input type="text" id="sT" value="${esc(x.title)}"></label>
    <div class="two"><label class="f"><span>כמות</span><input type="number" inputmode="decimal" id="sQ" min="0" step="any" value="${+x.qty||1}"></label>
    <label class="f"><span>יחידה</span><select id="sU">${UNITS.map(u=>`<option value="${u}" ${u===(x.unit||"")?"selected":""}>${u||"יחידות"}</option>`).join("")}</select></label></div>
    <label class="f"><span>הערה (מותג, גודל, מה לבדוק)</span><input type="text" id="sN" value="${esc(x.note||"")}"></label>
    <label class="f"><span>מחלקה</span><select id="sD">${shopDepts().map(d=>`<option ${d===x.dept?"selected":""}>${esc(d)}</option>`).join("")}</select></label>
    <div class="row"><button class="btn" id="sS">שמירה</button><button class="btn ghost" id="sX" style="color:var(--danger)">מחיקה</button></div>`, body=>{
      $("#sS",body).onclick=()=>{
        const t=$("#sT",body).value.trim(); if(!t){ $("#sT",body).focus(); return; }
        const d=$("#sD",body).value;
        if (!state.shopMap || typeof state.shopMap!=="object") state.shopMap={};
        if (d!==guessDept(t) || state.shopMap[t]) { if(d!==guessDept(t)) state.shopMap[t]=d; else delete state.shopMap[t]; }
        const q = parseFloat($("#sQ",body).value);
        x.title=t; x.dept=d; x.qty = q>0 ? q : 1; x.unit=$("#sU",body).value; x.note=$("#sN",body).value.trim();
        save(); renderShop(); closeDlg(); toast("נשמר");
      };
      $("#sX",body).onclick=async()=>{ if(await askConfirm("למחוק את \""+x.title+"\"?","מחיקה")){ state.shop=state.shop.filter(y=>y.id!==x.id); save(); renderShop(); closeDlg(); } };
    });
}

/* ---------- בפנטן ---------- */
const BEP_DAYS = [2,3,4,5]; // שלישי עד שישי
function bepEntries(){ return (state.log||[]).filter(x=>x.type==="bepanthen").sort((a,b)=>a.t-b.t); }
function renderBep(){
  const sq = $("#bepSq"); if(!sq) return;
  const now = new Date(), t0 = today0(), wk = addDays(t0, -t0.getDay()), E = bepEntries();
  let any = 0;
  sq.innerHTML = BEP_DAYS.map(d=>{
    const day = addDays(wk, d), a = +day, b = +addDays(day,1);
    const n = E.filter(x=>x.t>=a && x.t<b).length; if(n) any++;
    const isToday = +day === +t0;
    return `<div class="bsq"><i class="${n?"full":""} ${isToday?"today":""}">${n? (n>1?n:"✓") : ""}</i><span>${DAYN[d]}׳</span></div>`;
  }).join("");
  const last = E[E.length-1];
  $("#bepSub").textContent = last ? "אחרון: "+new Date(last.t).toLocaleDateString("he-IL",{weekday:"short"})+" "+new Date(last.t).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}) : "עוד לא תועד";
}
function openBep(){
  const E = bepEntries().reverse();
  const byDay = new Map();
  E.forEach(x=>{ const k = iso(new Date(x.t)); if(!byDay.has(k)) byDay.set(k,[]); byDay.get(k).push(x); });
  const html = (E.length ? [...byDay.entries()].slice(0,40).map(([k,arr])=>`<div class="bday">${esc(fmtShort(parseD(k)))} · ${arr.length} פעמים</div>${arr.map(x=>`<div class="btime"><span>${esc(new Date(x.t).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}))}</span><span class="muted small">${esc(ago(x.t))}</span></div>`).join("")}`).join("")
    : `<p class="note" style="margin-top:0">עוד לא תועד בפנטן. הוא מסומן ביומן, או בכפתור שלמטה.</p>`)
    + `<button class="btn full" id="bepNow" style="margin-top:16px">＋ רישום בפנטן עכשיו</button>`;
  openDlg("בפנטן: הזמנים שתועדו", html, body=>{
    $("#bepNow",body).onclick=()=>{ state.log.push({id:uid(), t:Date.now(), type:"bepanthen", note:""}); save(); renderLog(); renderBep(); closeDlg(); toast("בפנטן נרשם"); };
  });
}

/* ---------- TASKS ---------- */
function renderTasks(){
  if(!Array.isArray(state.tasks)) state.tasks=[];

const LOGT = {

function ago(ms){ const m=Math.floor((Date.now()-ms)/60000); if(m<1) return "עכשיו"; if(m<60) return "לפני "+m+" דק׳"; const h=Math.floor(m/60), r=m%60; return "לפני "+h+" ש׳"+(r?" ו־"+r+" דק׳":""); }
function renderLog(){
  try{ renderBep(); }catch(e){}
  const L = state.log.slice().sort((a,b)=>b.t-a.t);
  const lastFeed = L.find(x=>LOGT[x.type] && LOGT[x.type].feed);
  const start = +today0();
  const todays = L.filter(x=>x.t>=start);
  const feeds = todays.filter(x=>LOGT[x.type]?.feed).length, diapers = todays.filter(x=>LOGT[x.type]?.diaper).length;
  $("#since").innerHTML = `<div><span class="small muted">האכלה אחרונה</span><b>${lastFeed? ago(lastFeed.t):"—"}</b>${lastFeed?`<span class="small muted">${LOGT[lastFeed.type].t}</span>`:""}</div>
    <div><span class="small muted">היום</span><b>${feeds} 🍼 ${diapers} 🧷</b><span class="small muted">האכלות וחיתולים</span></div>`;
  const recent = L.filter(x=>x.t >= start - 6*86400000);
  if(!recent.length){ $("#todayTitle").textContent="היום"; $("#logBody").innerHTML=`<div class="panel"><div class="empty">לחיצה על כפתור למעלה רושמת עם השעה הנוכחית.</div></div>`; return; }
  $("#todayTitle").textContent = "7 ימים אחרונים";
  const dayLbl = t => { const n=Math.round((start-(+new Date(new Date(t).setHours(0,0,0,0))))/86400000); return n===0?"היום":n===1?"אתמול":new Date(t).toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric"}); };
  let html="", last="";
  recent.forEach(x=>{ const dl=dayLbl(x.t), dt=new Date(x.t);
    if(dl!==last){ html+=(last?`</ul>`:"")+`<h3 style="margin:16px 0 6px;font-size:15px;color:var(--muted)">${dl}</h3><ul class="list loglist">`; last=dl; }
    html+=`<li><span class="time">${dt.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})}</span>
    <div class="body"><div class="title">${LOGT[x.type]?.ic||""} ${LOGT[x.type]?.t||""}${x.note?", "+esc(x.note):""}</div></div>
    <button class="more" data-dl="${x.id}" aria-label="מחיקה">🗑</button></li>`; });
  $("#logBody").innerHTML = html+"</ul>";
  document.querySelectorAll("[data-dl]").forEach(b=>b.onclick=async()=>{
    const x=state.log.find(y=>y.id===b.dataset.dl); if(!x) return;
    const when=new Date(x.t).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
    if(await askConfirm("למחוק את הרישום \""+(LOGT[x.type]?.t||"")+"\" משעה "+when+"?","מחיקה")){ state.log=state.log.filter(y=>y.id!==x.id); save(); renderLog(); toast("נמחק"); }
  });
}
